name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 23.88.99.155
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /srv/bingo_la_negra
            git fetch origin
            git reset --hard origin/main
            cd backend
            npm install --omit=dev
            pm2 restart bingo_la_negra
